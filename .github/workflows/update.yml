name: Living literature update

# Re-runs discovery monthly, appends up to five new papers, and commits outputs.
on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run discovery (force fresh OpenAlex query)
        run: |
          cd src
          python discover.py --refresh
          python report.py
          python figures.py --input ../data/bibliography.csv --outdir ../figures --trend-min 2015 --trend-max 2025

      - name: Commit refreshed bibliography
        run: |
          git config user.name  "living-survey-bot"
          git config user.email "actions@github.com"
          git add data/ figures/ BIBLIOGRAPHY.md
          git commit -m "chore: monthly living-literature update [skip ci]" || echo "no changes"
          git push
