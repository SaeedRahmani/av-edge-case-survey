# Configuration for the living literature discovery pipeline.
# Edit and re-run `python src/discover.py` to change scope or strictness.
# All screening/tuning parameters below are read by src/discover.py at startup.

# --- retrieval ---
from_year: 2023             # surface genuinely new work since the survey
max_publication_date: null  # null = use the workflow/run date; figures still cap trends separately
mailto: saeedrmd@gmail.com  # OpenAlex polite pool

# Boolean search decomposed into AV-term x edge-case-term phrase queries.
av_terms:
  - autonomous driving
  - automated driving
  - autonomous vehicle
  - automated vehicle
  - self-driving
edge_terms:
  - edge case
  - corner case
  - anomaly detection
  - out-of-distribution
  - novelty detection
  - rare event
  - safety-critical scenario
  - critical scenario
  - scenario generation
  - near-miss
  - surrogate safety

# --- screening / tuning (calibrated from the seed corpus) ---
embedding_model: sentence-transformers/all-MiniLM-L6-v2
knn: 5                     # neighbours for seed-similarity gate
seed_sim_percentile: 50   # gate (b): >= median seed centrality
margin_percentile: 25     # gate (a): >= 25th-pctl seed relevance margin
bootstrap_target: 120     # first-run curated addition size when discovered.csv is empty
monthly_add_limit: 5      # later runs append at most this many new papers
ceiling_frac: 0.60        # soft ceiling: max share of picks from one class
year_ceiling_frac: 0.40   # optional guard: max share of picks from one publication year
recency_weight: 0.01      # modest recency nudge; bounded by relevance gates and year ceiling
# Non-peer-reviewed preprint mills excluded (arXiv kept); see discover.PREPRINT_MILL
exclude_source_patterns:
  - theses.fr
exclude_title_patterns:
  - "$WIP$"

# --- optional LLM second opinion (modular LLM) ---
use_llm: false            # requires ANTHROPIC_API_KEY; reviews borderline records only
llm_model: claude-opus-4-7
llm_review_confidence: 0.75 # high-confidence LLM agreement/disagreement threshold
